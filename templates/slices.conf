# slices.conf — configuración de ./slices para este repo. Es bash: se lee con `source`.
# `./slices init` genera uno con lo detectado; este es el ejemplo completo y comentado.

BASE="$(git -C "$RAIZ" symbolic-ref --short HEAD)"  # rama a la que se mergean los slices (la del ticket)
SPECS="specs"                 # dónde viven los SPEC (cambialo si el repo ya usa specs/ para otra cosa)
RECIBOS="recibos"             # dónde queda la evidencia de cada slice
# WORKTREES="$RAIZ/.slices"   # default: adentro del repo e ignorado, para heredar la confianza de la carpeta

# Quién lanza a los workers
LANZADOR="orca"               # orca: worker supervisado de Orca · local: proceso desacoplado en esta máquina
AGENTE_ORCA="cursor"          # con orca: cursor (cursor-agent) | claude | codex | grok (CLI de xAI) | gemini …
EJECUTOR="cursor"             # con local: cursor | claude | codex | cmd
# EJECUTOR_CMD='mi-cli --prompt "$SLICES_PROMPT"'   # con EJECUTOR=cmd: cualquier CLI
MODELO="cursor-grok-4.6-high" # id del modelo para los workers; vacío = el default del agente

# Quién juzga
JUEZ="jev"                    # jev (TypeSafe) | claude (un modelo distinto del ejecutor) | vacío = solo checks

# Hasta dónde avanza solo `./slices auto`
MODO="semi"                   # auto: mergea solo · semi: frena antes de cada merge · manual: todo a mano
MAX_INTENTOS=3                # rechazos seguidos antes de pasarle el slice a una persona
MAX_PARALELO=2                # workers a la vez (con LANZADOR=local; Orca lleva su propia cuenta)

# Lo que tiene que pasar para que un slice cierre. "nombre::comando", se corre en el worktree.
CHECKS=(
  "tests::npm test --silent"
  # "lint::git diff --name-only --diff-filter=AM HEAD -- '*.py' | xargs -r ruff check"
)

# Se corre una vez en cada worktree nuevo (dependencias, .env, base de pruebas propia…)
PREPARAR=""
# PREPARAR='cp -a "$RAIZ/.env" . && sed -i -E "s#^(DATABASE_URL=.*/)([^/?]+)#\1\2_wt$(basename $PWD)#" .env'
